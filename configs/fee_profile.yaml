# A股交易费用。**注意这是不对称的**——印花税只在卖出时收。
#
# 回测里 cost_per_turnover 必须拆成 buy_cost / sell_cost 两个数，
# 用一个对称值会系统性低估卖出成本。
#
# ⚠ **南京证券的实际佣金费率仍然未知。** 2026-09-03 用户查了 App 的
#    「佣金费率查询」，页面写的是：
#        佣金   —— 「**不高于**成交金额的 3‰，最低收取 5 元」
#        印花税 —— 「按成交金额的 1‰ 向卖方收取」
#
#    这两行**都不能直接填进来**：
#
#    · 3‰ 是**监管上限**（注意「不高于」三个字），是公示的封顶值，不是任何人
#      实际付的价。散户实际费率在开户时协商，常见万2.5~万5。
#    · 那个 1‰ 的印花税是**过期的** —— 现行 0.5‰（2023-08-28 减半）。
#      这一条反过来印证整页展示的是旧的/牌照上限值，下面的 0.0005 是对的。
#
#    真实费率只有两个可靠来源：**交割单里的「手续费」÷ 成交金额**，
#    或者直接问开户营业部。
#
#    好消息是这个输入没有原先担心的那么关键。2026-09-03 敏感度实测
#    （k=3、每日调仓、择时 SMA=100，2025-01~2026-08）：
#
#        佣金费率      往返成本       年化     Sharpe   最大回撤
#        万2.5（当前）  10.2bp   +196.91%    2.6921   -15.28%
#        万3           11.2bp   +192.08%    2.6549   -15.54%
#        万5           15.2bp   +173.52%    2.5061   -16.54%
#        千1           25.2bp   +132.11%    2.1335   -19.01%
#        3‰（上限）     65.2bp    +20.19%    0.6356   -28.19%
#
#    **万2.5 到万5 之间几乎没差别。** 只有真按 3‰ 上限收，策略才会被打回
#    原形 —— 年化 +20.19%，而等权持有基准是 +18.69%，等于白忙一场。
#    所以：确认实际费率落在正常散户区间，当前这个值就够用；
#    真是 3‰ 的话，该做的是先去谈费率，而不是调策略。
#
#    值暂不改：万3 和万2.5 差 2.5%（相对），小于这次测量本身的不确定性，
#    换一个同样未经证实的数字不增加任何信息。

# 佣金：双边收取，有最低金额
# 10万账户 k=3 时单笔约3万，万2.5 = 7.5元 > 5元，所以最低值不生效；
# 但如果将来 top_k 调大导致单笔变小，最低5元会突然变成主要成本。
commission_rate: 0.00025   # 万2.5
commission_min: 5.0        # 元

# 印花税：**仅卖出**。2023-08-28 由 0.1% 减半至 0.05%。
stamp_tax_rate: 0.0005

# 过户费：双边。2022-04 起沪深统一并降至 0.001%。
transfer_fee_rate: 0.00001

# --- 参考：往返总成本 ---
#   佣金 2.5bp × 2 + 印花税 5bp × 1 + 过户费 0.1bp × 2 ≈ 10.2bp
# 再叠上滑点（散户限价单约 10~20bp），一次完整调仓约 20~30bp。
# 这就是 QBG_REBALANCE_EVERY_DAYS 默认 10 而不是 1 的全部理由。
