# 风控参数。每一项都写清"为什么是这个值"——没有理由的魔数等于不敢改的魔数。
#
# 硬闸 / 订单闸的两级语义见 src/qbg/risk/gates.py：
#   硬闸失败  → 全盘不交易
#   订单闸失败 → 只砍 BUY，SELL 永远放行（卖出是降风险的，最需要能卖的时候
#                恰恰是跌得多、现金紧的时候）

# --- 实盘第三把锁 ---
# 另外两把在 .env：QBG_MODE=LIVE 和 I_CONFIRM_REAL=1。
# 三把分开是为了让"误开一把"不足以下出真单。
allow_live_mode: false

# --- 交易时段 ---
# 2026-08-25 随 P9c（券商自动下单）接通改为 true。
#
# 这是**硬闸**：非交易时段一票否决，当天什么都不做。所以它直接决定了计划任务
# 的触发时间 —— 盘前 07:30 那套是半自动时代的值（出清单给人工执行），
# 自动下单必须在盘中，现在是 09:30（见 docs/windows-schedule.md）。
#
# 改回 false 只有一种正当理由：退回顾问模式，盘后跑、次日人工执行。
# 那种情况下 QBG_MODE 也该是 ADVISORY —— 两者要一起改，否则就是在盘后
# 往券商发单。
require_trading_session: true

# --- 仓位 ---
# 单票上限。k=3 等权是 0.30，留一点余量给 renormalize 之后的偏移；
# 0.34 意味着即使复核砍到只剩 1 只，也不会把 100% 押上去。
max_position_pct: 0.34

# 现金下限。A股 T+1 且手动执行，留 5% 缓冲避免因为价格跳空导致按清单下单时
# 现金不够、部分单被拒。
min_cash_buffer_pct: 0.05

# --- 熔断 ---
# 单日亏损超过这个比例就砍掉当天所有 BUY（SELL 照常）。
max_daily_loss_pct: 0.03

# 个股止损。A股主板日内跌幅上限 10%，8% 意味着一个跌停日内就会触发，
# 是"止损但不至于被日常波动扫出去"的折中。
#
# **2026-09-14 按操作者要求接线**（qbg.risk.trailing.stop_loss_hits）。在此之前这个值
# 零引用，而文档一直写着"单票由 8% 止损管"。按成本价算；**调仓日也生效**（止损的票
# 从当天选股里剔除、槽位让给下一名），监控日直接卖成现金。设 0 = 关闭。
#
# 八项闸（scripts/29_trailing_gate.py --stop 0.08，k=3、每 10 日、20bp、10 相位平均）
# **两个窗口都没过**：
#
#                  Δ年化   Δ夏普   Δ回撤   相位极差     闸
#   388 日（生产）  +13.8p  +0.25   +5.1p   75→57p     不过（子区间 1/4、高原）
#   630 日（mid）    -4.3p  +0.02   +5.1p   89→25p     不过（收益、高原）
#
# 收益上不稳健：邻居 5% / 11% 的夏普分别是 0.88 / 1.01（生产）和 0.53 / 0.88（mid），
# 8% 是个尖峰。5% 两个窗口都大亏（来回被洗）。
#
# **保留它的理由是风控，不是收益**：回撤在两个窗口上都稳定地少 5.1 个点；而且相位极差
# 大幅缩小 —— 结果对"从哪天开始调仓"的依赖小了很多。择时关闭之后，这是唯一真的在管
# 单票下行的东西。这和关择时是同一种性质的决定，只是方向相反。
stop_loss_pct: 0.08

# --- 交易成本控制 ---
# 权重漂移带：目标权重和现有权重差异小于这个值就不动。
# 每次调仓往返约 10bp，3% 的漂移不值得为它付这个成本。
rebalance_drift_band: 0.03

# 限价相对参考价的让价幅度。买单 ×(1+x)、卖单 ×(1-x)。
#
# **参考价是昨天的收盘，不是当前市价。** 系统 09:30 下单，而行情缓存里最新
# 的一根日线是昨天的 —— 中间隔着一整个隔夜跳空。原来的 0.002（20bp）是按
# "相对当前价让一点"定的，用在一个隔夜之前的价格上完全不够。
#
# 沪深300 成分股 46 万个交易日的实测（昨收 -> 今开）：
#
#     跳空绝对值   P50 0.35%   P75 0.78%   P90 1.51%   P95 2.20%   P99 4.79%
#
#     让价      卖单挂不上   买单挂不上
#     0.2%        37.7%        27.4%     <- 原值。中位跳空就已经超过它了
#     0.5%        22.2%        16.6%
#     1.0%         9.8%         8.5%
#     2.0%         2.9%         3.1%     <- 现值
#     3.0%         1.2%         1.5%
#
# 2026-09-11 实测踩中：卖 688041 限价 231.91，而当日市价 228.21（隔夜跌 1.8%），
# 卖单挂在市价**上方**，一整天没成交。回款没到账，连带一笔买单被券商静默拒绝。
#
# **让得宽不等于成交价差。** 限价单按市价成交，让价只是一个防止极端价位的
# 护栏；它真正起作用只在开盘瞬间剧烈波动时。所以这里的取舍不是"多付 2%"，
# 而是"挂不上的概率 2.9% vs 37.7%"。上界另有 clamp_to_limits 按涨跌停夹逼。
# **这个值只在参考价是「昨收」时用**（没配 FUYAO_API_KEY，或当天取不到实时价）。
# 拿到当日实时价时用下面的 order_slippage_live_pct，那才是原本 0.002 的语境。
order_slippage_stale_pct: 0.02

# 参考价是**当日实时价**（同花顺官方 API 的盘中快照 / 集合竞价定价）时的让价。
#
# 这里不需要覆盖隔夜跳空 —— 参考价就是此刻的价，只需覆盖"读到价格"到
# "单子进交易所"之间那几秒的波动。0.002 是本参数最早的值，理由是"和 A股
# 散户单的典型滑点同量级"，而那条理由**正是为同期价格写的**，用在这里成立。
#
# 0.005 而不是 0.002：**占位值待压测。** 09:30 开盘那几分钟波动远大于盘中
# 均值，而本地没有分钟线（官方 API 也不提供），量不出来。等实测滑点攒够
# 20 笔（scripts/24_fill_slippage.py）再定。宁可先宽一点 ——
# 限价单按市价成交，宽的代价是极端行情下的护栏松一点，
# 窄的代价是根本挂不上（那正是 2026-09-11 踩的坑）。
order_slippage_live_pct: 0.005

# --- 数据新鲜度 ---
# data_freshness_guard：最新日K 允许落后几个交易日。
# 1 = 必须是最近一个交易日的数据。防止数据源静默返回陈旧数据后，
# 系统按上周的价格算出今天的限价。
max_stale_days: 1

# prediction_freshness_guard：模型预测允许落后几个交易日。**硬闸。**
# 3 = 允许周末 + 一天故障；再旧就停手让人看。
#
# 为什么单独一道闸而不是复用上面那个：**它们守的是两样东西**。
# 2026-09-09 实测，日流程连着一个月每天选出完全相同的三只票 —— 行情每天都在
# 更新（max_stale_days 一路绿灯），陈旧的是**预测**：生产模型的 test 段止于
# 2026-08-10，而 latest_date_scores 取的是"预测里最后一天"，于是那一天的分数
# 被反复用了 30 天。当时没有任何一道闸在看预测的日期。
#
# 定 3 而不是 1：预测在盘后重训，遇上重训失败或周末，1 会天天误伤；
# 而真正的故障（模型停更）是以周计的，3 足够把它抓出来。
max_prediction_stale_days: 3
