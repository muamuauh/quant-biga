version: 1
params:
  qbg_top_k:
    scope: settings
    tier: A
    type: int
    min: 2
    max: 5
    step: 1
  qbg_keep_rank:
    scope: settings
    tier: A
    type: int
    min: 3
    max: 30
    step: 1
  qbg_market_sma:
    scope: settings
    tier: A
    type: int
    allowed: [0, 20, 50, 100, 150, 200, 250]
  # 择时迟滞缓冲带。见 config.py 的实测表：它治的是抖动（1620 日翻 75 次），
  # 不是"太保守"。上限 0.05 —— 再宽就等于关掉择时，那该直接把 sma 设 0。
  qbg_market_sma_band:
    scope: settings
    tier: A
    type: float
    allowed: [0.0, 0.01, 0.02, 0.03, 0.05]
  # 择时指数是否只算当天确实在指数里的票。和缓冲带**捆绑**：单独开任何一个
  # 都过不了八项闸，两个一起才过。见 config.py 的实测表。
  qbg_market_index_eligible:
    scope: settings
    tier: A
    type: int
    allowed: [0, 1]
  qbg_industry_neutral:
    scope: settings
    tier: A
    type: int
    allowed: [0, 1]
  qbg_rebalance_every_days:
    scope: settings
    tier: A
    type: int
    min: 5
    max: 21
    step: 1
  max_position_pct:
    scope: risk_limits
    tier: A_risk
    type: float
    min: 0.20
    max: 0.40
    step: 0.01
  min_cash_buffer_pct:
    scope: risk_limits
    tier: A_risk
    type: float
    min: 0.03
    max: 0.20
    step: 0.01
  stop_loss_pct:
    scope: risk_limits
    tier: A_risk
    type: float
    min: 0.05
    max: 0.20
    step: 0.01
  max_daily_loss_pct:
    scope: risk_limits
    tier: A_risk
    type: float
    min: 0.01
    max: 0.08
    step: 0.01
  qbg_ensemble_seeds:
    scope: settings
    tier: A_slow
    type: int
    min: 1
    max: 5
    step: 1
  qbg_agents_min_rating:
    scope: settings
    tier: B
    type: str
    allowed: [Buy, Overweight, Hold, Underweight, Sell]
  rebalance_drift_band:
    scope: risk_limits
    tier: B
    type: float
    min: 0.0
    max: 0.10
  # 让价拆成了两个：参考价是**昨收**时用 stale，是**当日实时价**时用 live。
  # 两者量级差一个数量级，共用一个区间必然有一头是错的。
  order_slippage_stale_pct:
    scope: risk_limits
    tier: B
    type: float
    # 上界 2026-09-11 从 0.005 放宽到 0.04：要覆盖隔夜跳空，实测 0.5% 时仍有
    # 22% 的卖单挂不上市价正确的一侧（表见 risk_limits.yaml）。基线值 0.02，
    # 旧上界意味着调参 agent 连当前值都提不出来 —— 区间不含现值，
    # 等于这个参数被静默冻结。
    min: 0.0005
    max: 0.04
  order_slippage_live_pct:
    scope: risk_limits
    tier: B
    type: float
    # 参考价就是此刻的价，只需覆盖几秒的波动，所以区间比 stale 窄一个数量级。
    # 当前 0.005 是**占位值待压测**（没有分钟线，量不出开盘那几分钟的波动）。
    min: 0.0005
    max: 0.01
frozen:
  - qbg_mode
  - i_confirm_real
  - allow_live_mode
  - qbg_agent_enabled
  - qbg_agent_autoapply
  - qbg_portfolio_source
policy:
  max_applied_changes_per_week: 1
  cooldown_trading_days_per_param: 10

